<!DOCTYPE html>
<html lang="am" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASH-X-B | P2P Crypto & ETB Exchange</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-buy { background: #10b981; transition: all 0.2s; }
        .btn-buy:hover { background: #059669; }
        .btn-sell { background: #ef4444; transition: all 0.2s; }
        .btn-sell:hover { background: #dc2626; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">
    <!-- Navigation Header -->
    <header class="glass-card border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl font-black tracking-wider text-red-500">ASH<span class="text-white">X</span>B</span>
                <span class="text-xs bg-red-500/20 text-red-400 px-2 py-0.5 rounded-full font-semibold">P2P</span>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-xs text-gray-400 hidden sm:inline"><i class="fa-solid fa-circle text-emerald-500 text-[10px] mr-1"></i> Live Database</span>
                <button onclick="togglePostModal()" class="bg-red-600 hover:bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow">Post Offer</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="glass-card rounded-2xl p-6 mb-8 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center shadow-xl">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold mb-2 text-white">ASH-X-B P2P Marketplace</h1>
                <p class="text-gray-400 text-sm">Real-time crypto and ETB exchange powered by Supabase backend.</p>
            </div>
        </div>

        <!-- Live Offers Container -->
        <div class="space-y-4">
            <h2 class="text-lg font-bold text-gray-200">Active Market Offers</h2>
            <div id="offers-container" class="space-y-3">
                <div class="text-center py-8 text-gray-400 text-sm">Loading offers from Supabase...</div>
            </div>
        </div>
    </main>

    <!-- Post Offer Modal -->
    <div id="postModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md rounded-2xl p-6 border border-gray-700 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white">Publish New Offer</h3>
                <button onclick="togglePostModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="offerForm" class="space-y-4 text-sm">
                <div>
                    <label class="block text-gray-400 mb-1">Merchant Name</label>
                    <input type="text" id="merchantName" required placeholder="Ash_Trader" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">Price per USDT (ETB)</label>
                    <input type="number" step="0.01" id="price" required placeholder="142.50" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-white">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1">Payment Method</label>
                    <input type="text" id="bankDetails" required placeholder="CBE / Telebirr" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-2.5 text-white">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-xl shadow-lg mt-2">
                    Save to Database
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        &copy; 2026 ASH-X-B P2P Exchange. Powered by Supabase & GitHub Pages.
    </footer>

    <script>
        // Supabase Integration
        const SUPABASE_URL = 'https://yvtnrohneqozpbtlxmrm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_zq_XIXe-p0pr0rINsP3ZHw_fTyBszG8';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function togglePostModal() {
            document.getElementById('postModal').classList.toggle('hidden');
        }

        async function fetchOffers() {
            const container = document.getElementById('offers-container');
            const { data, error } = await supabaseClient.from('p2p_offers').select('*').order('created_at', { ascending: false });
            
            if (error || !data || data.length === 0) {
                container.innerHTML = '<div class="glass-card rounded-xl p-4 text-center text-gray-400 text-sm">No active offers found in database. Click "Post Offer" to add one!</div>';
                return;
            }

            container.innerHTML = data.map(offer => `
                <div class="glass-card rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center font-bold text-lg">
                            ${offer.merchant_name ? offer.merchant_name.charAt(0).toUpperCase() : 'A'}
                        </div>
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-white">${offer.merchant_name}</span>
                                <span class="text-xs bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded">99%</span>
                            </div>
                            <div class="text-xs text-gray-400 mt-0.5">${offer.bank_details}</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-6 w-full sm:w-auto justify-between sm:justify-end">
                        <div class="text-right">
                            <div class="text-lg font-extrabold text-emerald-400">${offer.price} <span class="text-xs text-gray-400">ETB</span></div>
                        </div>
                        <button onclick="alert('Starting trade for offer ID: ${offer.id}')" class="btn-buy text-white font-bold px-5 py-2 rounded-xl text-sm shadow-md">
                            Trade
                        </button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('offerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const merchant_name = document.getElementById('merchantName').value;
            const price = parseFloat(document.getElementById('price').value);
            const bank_details = document.getElementById('bankDetails').value;

            const { error } = await supabaseClient.from('p2p_offers').insert([{ merchant_name, price, bank_details }]);
            if (error) {
                alert('Error posting offer: ' + error.message);
            } else {
                alert('Offer published successfully to database!');
                togglePostModal();
                document.getElementById('offerForm').reset();
                fetchOffers();
            }
        });

        // Load offers on startup
        fetchOffers();
    </script>
</body>
</html>
